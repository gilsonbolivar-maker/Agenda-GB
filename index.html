<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Agenda GB" />
  <title>Agenda GB</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <p class="eyebrow" id="clock">—</p>
        <h1 id="viewTitle">Painel</h1>
      </div>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Ajustes">⚙</button>
    </header>

    <main id="views">
      <section class="view on" id="view-painel" data-title="Painel">
        <article class="hero" id="heroHoje">
          <p class="muted">Hoje</p>
          <h2 id="hojeData">—</h2>
          <p class="turno" id="hojeTurno">Defina seu turno em Ajustes</p>
        </article>

        <div class="block-head">
          <h3>Próximos</h3>
          <button class="text-btn" type="button" data-go="agenda">Ver agenda</button>
        </div>
        <div id="listaProximos" class="cards"></div>

        <div class="block-head">
          <h3>Atalhos</h3>
          <button class="text-btn" type="button" data-go="atalhos">Editar</button>
        </div>
        <div id="atalhosRapidos" class="atalhos"></div>
      </section>

      <section class="view" id="view-agenda" data-title="Agenda">
        <div class="day-nav">
          <button class="icon-btn" id="prevDay" type="button">‹</button>
          <button class="day-label" id="agendaDiaBtn" type="button"></button>
          <button class="icon-btn" id="nextDay" type="button">›</button>
        </div>
        <input type="date" id="agendaDatePicker" class="hidden-date" />
        <div id="listaDia" class="cards"></div>
      </section>

      <section class="view" id="view-mes" data-title="Mês">
        <div class="day-nav">
          <button class="icon-btn" id="prevMonth" type="button">‹</button>
          <h3 id="mesLabel"></h3>
          <button class="icon-btn" id="nextMonth" type="button">›</button>
        </div>
        <div class="weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
        <div id="gradeMes" class="grade"></div>
        <div id="listaMesDia" class="cards"></div>
      </section>

      <section class="view" id="view-atalhos" data-title="Atalhos">
        <p class="hint">Abre o app oficial. Não lê suas mensagens nem seus arquivos.</p>
        <div id="atalhosLista" class="atalhos col"></div>
      </section>
    </main>

    <button class="fab" id="btnNovo" type="button">+ Novo</button>

    <nav class="tabbar">
      <button type="button" class="on" data-go="painel">Painel</button>
      <button type="button" data-go="agenda">Agenda</button>
      <button type="button" data-go="mes">Mês</button>
      <button type="button" data-go="atalhos">Atalhos</button>
    </nav>
  </div>

  <dialog id="dlgEvento">
    <form id="formEvento" method="dialog">
      <h2 id="dlgTitulo">Novo compromisso</h2>
      <label>Título
        <input name="title" required maxlength="80" placeholder="Ex.: Dentista" />
      </label>
      <div class="row">
        <label>Data
          <input name="date" type="date" required />
        </label>
        <label>Hora
          <input name="time" type="time" />
        </label>
      </div>
      <label>Tipo
        <select name="tag">
          <option value="pessoal">Pessoal</option>
          <option value="trabalho">Trabalho</option>
          <option value="saude">Saúde</option>
          <option value="outro">Outro</option>
        </select>
      </label>
      <label>Nota
        <textarea name="notes" rows="3" maxlength="240" placeholder="Opcional"></textarea>
      </label>
      <menu>
        <button type="button" class="ghost" id="btnApagar" hidden>Apagar</button>
        <span class="grow"></span>
        <button type="button" class="ghost" id="btnCancelar">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlgAjustes">
    <form id="formAjustes" method="dialog">
      <h2>Ajustes</h2>
      <label>Seu nome
        <input name="nome" maxlength="40" placeholder="Gilson" />
      </label>
      <label>Turno de hoje (texto livre)
        <input name="turno" maxlength="40" placeholder="Ex.: 16h · Grupo C" />
      </label>
      <label>WhatsApp (DDI + número)
        <input name="whatsapp" inputmode="tel" placeholder="5577999999999" />
      </label>
      <label>Hotmail / Outlook
        <input name="outlook" type="url" placeholder="https://outlook.live.com/mail/" />
      </label>
      <label>Google Drive
        <input name="drive" type="url" placeholder="https://drive.google.com/" />
      </label>
      <label>OneDrive
        <input name="onedrive" type="url" placeholder="https://onedrive.live.com/" />
      </label>
      <div class="row tight">
        <button type="button" class="ghost" id="btnExportar">Exportar</button>
        <button type="button" class="ghost" id="btnImportar">Importar</button>
      </div>
      <input type="file" id="fileImport" accept="application/json" hidden />
      <p class="muted tiny" id="installHint">No iPhone: Compartilhar → Adicionar à Tela de Início.</p>
      <menu>
        <span class="grow"></span>
        <button type="button" class="ghost" id="btnFecharAjustes">Fechar</button>
        <button type="submit" class="primary">Salvar</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
